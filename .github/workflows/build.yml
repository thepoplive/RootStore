name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg

      # Legacy SDK needed only as LINK sysroot: modern Xcode SDKs dropped
      # armv7 .tbd stubs (see scripts/build.sh header for details).
      - name: Fetch legacy iOS SDK (sparse)
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/theos/sdks.git third_party/theos-sdks
          git -C third_party/theos-sdks sparse-checkout set iPhoneOS10.3.sdk
          test -d third_party/theos-sdks/iPhoneOS10.3.sdk

      - name: Build .deb
        run: make package

      - name: Validate .deb
        run: make validate

      - uses: actions/upload-artifact@v4
        with:
          name: rootstore-deb
          path: build/*.deb

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.deb \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" build/*.deb --clobber
